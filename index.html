<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fotos Vitória</title>

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #000;
  color: #fff;
  padding: 30px 15px;
}

h1 {
  color: #fff;
}

p {
  color: #ccc;
}

input, button {
  margin: 12px;
  padding: 14px;
  border-radius: 8px;
  border: none;
}

button {
  background: #c0c0c0;
  color: #000;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>

<body>

<h1>📸 Fotos da Vitória</h1>

<p>Envie aqui as fotos e vídeos da festa!</p>

<input type="file" id="arquivo" accept="image/*,video/*">

<br>

<button onclick="enviar()">Enviar arquivo</button>

<p id="mensagem"></p>

<script>

const URL_APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycbyYk_1cdOUgIcTfj8fmb7uiT6r0duG9LcJ0_U4HIIKHMyTC4Oym_htvVaxRX_h6qSUF/exec";

function enviar() {

  const arquivo = document.getElementById("arquivo").files[0];
  const mensagem = document.getElementById("mensagem");

  if (!arquivo) {
    mensagem.innerText = "Escolha uma foto ou vídeo primeiro.";
    return;
  }

  mensagem.innerText = "Enviando... aguarde ❤️";

  const leitor = new FileReader();

  leitor.onload = function(e) {

    const base64 = e.target.result.split(",")[1];

    const dados = {
      filename: arquivo.name,
      image: base64
    };

    fetch(URL_APPS_SCRIPT, {
      method: "POST",
      body: JSON.stringify(dados)
    })
    .then(resposta => resposta.json())
    .then(resultado => {

      if (resultado.ok) {
        mensagem.innerText =
          "✅ Enviado com sucesso! Obrigada pela sua foto! ❤️";

        document.getElementById("arquivo").value = "";

      } else {
        mensagem.innerText =
          "❌ Não foi possível enviar. Tente novamente.";
      }

    })
    .catch(erro => {
      mensagem.innerText =
        "❌ Ocorreu um erro ao enviar. Tente novamente.";
    });

  };

  leitor.readAsDataURL(arquivo);
}

</script>

</body>
</html>
